spring:
  application:
    name: rbac-system
  profiles:
    default: local
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false
  threads:
    virtual:
      enabled: false
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    threads:
      max: 200

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
    default-statement-timeout: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Redis is an accelerator, not a dependency: its outage must not mark the
    # application unhealthy and trigger load-balancer removal (02 §18).
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

rbac:
  jwt:
    issuer: rbac-system
    audience: rbac-admin
    active-kid: "1"
    ttl: 2h
    clock-skew-seconds: 60
    keys:
      "1": ${RBAC_JWT_KEY_1:}
  cache:
    soft-ttl-seconds: 30
    stale-policy: fail-open
    channel: rbac:cache:invalidate
    load-on-startup: true
  redis:
    enabled: true
  client-ip:
    trusted-proxies: []
  cors:
    allowed-origins: []
  admin:
    bootstrap:
      enabled: true
      username: admin
      nickname: 管理员

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # In-memory H2 keeps the zero-setup local profile reliable; use the
    # container/MySQL profile when data must survive a restart.
    url: "jdbc:h2:mem:rbac;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration

rbac:
  # No signing key is committed for the local profile. Set RBAC_JWT_KEY_1
  # (>= 32 bytes) in the environment, exactly as for the container profile.
  redis:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: container
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:rbac}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false"
    username: ${MYSQL_USER:rbac}
    password: ${MYSQL_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2s

rbac:
  jwt:
    keys:
      "1": ${RBAC_JWT_KEY_1}
  redis:
    enabled: true
  client-ip:
    trusted-proxies: ${RBAC_TRUSTED_PROXIES:}
  cors:
    allowed-origins: ${RBAC_CORS_ORIGINS:}

logging:
  structured:
    format:
      console: ecs
