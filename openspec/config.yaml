# 04 · 接口设计

相关文档：[00 基线](./00-编码代理工作基线.md) · [01 需求](./01-需求规格说明书.md) · [02 总体设计](./02-总体设计说明书.md) · [03 数据模型](./03-数据模型设计.md) · [06 性能](./06-性能与容量设计.md)

## 1. 通用约定

### 1.1 基础约定

| 项 | 约定 |
|---|---|
| 基础路径 | `/api` |
| 风格 | RESTful；资源名复数、小写、连字符 |
| 数据格式 | 请求与响应均为 `application/json; charset=utf-8` |
| 时间格式 | ISO-8601 带时区偏移，如 `2026-10-12T20:15:30.123+08:00`；禁止无时区的时间串 |
| 认证方式 | 请求头 `Authorization: Bearer <token>`；不放 URL 参数，不使用 Cookie 会话 |
| 客户端 IP | 只能由 `ClientIpResolver` 在可信代理边界内解析；不接受请求体、查询参数或未校验请求头传入的 IP |
| 版本策略 | 不使用 `/v1` 前缀；契约变更通过新增字段或新增接口实现，不修改既有字段语义 |
| 字段命名 | 驼峰，如 `createdAt` |
| 令牌失效时效 | 正常 ≤ 1 秒；Redis 故障 ≤ 30 秒（见 01 FR-A9）；禁止承诺"立即失效" |

### 1.2 统一响应体

```json
{ "code": 0, "message": "ok", "data": {}, "traceId": "b7f2c1a9e4d3" }
```

| 字段 | 说明 |
|---|---|
| `code` | 0 表示成功；非 0 为业务错误码（见 1.3） |
| `message` | 面向用户的中文提示 |
| `data` | 业务数据；无数据时为 `null` |
| `traceId` | 链路追踪 ID，同时写入响应头 `X-Trace-Id` |

### 1.3 错误码

| HTTP | `code` | 含义 | 前端处理 |
|---|---|---|---|
| 200 | 0 | 成功 | 正常处理 |
| 400 | 40000 | 参数校验失败 | 表单内联提示字段级错误 |
| 401 | 40100 | 令牌本身无效（缺失/签名错误/已过期） | 清除本地令牌，跳转登录页 |
| 401 | 40101 | 令牌有效但已被作废（登出/改密/停用/全局作废） | 同上，提示"登录状态已失效" |
| 403 | 40300 | 无操作权限 | 提示"无操作权限"；不得返回所需权限码 |
| 404 | 40400 | 资源不存在 | 提示并返回列表 |
| 409 | 40900 | 唯一性冲突（账号/角色码/权限码重复） | 表单内联提示 |
| 409 | 40950 | 并发冲突，`expectedVersion` 不匹配 | 重新拉取最新数据并提示"数据已被他人修改"；禁止静默重放 |
| 429 | 42900 | 限流 | 提示稍后重试，展示倒计时 |
| 503 | 50300 | 服务降级：鉴权数据从未成功加载，或已切到 fail-closed 姿态 | 展示"系统暂时不可用"，按 `Retry-After` 重试 |
| 500 | 50000 | 服务器内部错误 | 提示"系统繁忙"，展示 `traceId`；响应体不得含堆栈 |

必须分开的三组状态，不得合并：

- 40101 与 40100：前者是"有效但被作废"，后者是"令牌无效"。合并会丢失"批量踢下线/令牌滥用"的监测能力。
- 50300 与 500：前者是按设计降级，后者是程序错误。合并会让运维把设计内降级误判为代码缺陷。
- 40950 与 40900：前者是版本冲突（刷新后重试可解决），后者是唯一约束冲突（必须换值）。

### 1.4 分页

浅翻页（默认）：

| 参数 | 类型 | 默认 | 约束 |
|---|---|---|---|
| `page` | int | 1 | 从 1 开始 |
| `size` | int | 20 | 上限 200；超过则截断为 200 |

响应结构：

```json
{ "records": [], "total": 1234, "page": 1, "size": 20 }
```

游标分页（仅审计日志使用）：

| 参数 | 说明 |
|---|---|
| `lastId` | 上一页最后一条 ID；首页不传 |
| 响应额外字段 | `nextLastId`，无更多数据时为 `null` |

审计日志禁止使用 `OFFSET`：`LIMIT 100000, 20` 会先扫描并丢弃前 10 万行。必须用 `WHERE id < lastId ORDER BY id DESC LIMIT ?`。

### 1.5 鉴权声明（强制）

每个 `@RequestMapping` 方法必须有且只有一个鉴权声明：

| 注解 | 含义 | 使用场景 |
|---|---|---|
| `@PublicApi` | 无需登录 | 登录、健康检查 |
| `@RequiresLogin` | 需要登录，不需要权限码 | `/api/auth/me`、登出、改自己的密码 |
| `@RequiresPermission("码")` | 需要登录且拥有该权限码 | 全部管理类接口 |

- 三者都不标注：默认拒绝，返回 403 并记录告警；由构建门禁拦截。
- `@RequiresPermission` 只接受 API 类权限码或通配码（`*`、`sys:*`、`sys:user:*`）；引用 `MENU` 类权限码由门禁拦截。
- 一个接口只声明一个权限码。需要两个权限码时拆成两个接口，禁止引入 `anyOf` / `allOf` 组合。

### 1.6 审计声明（强制，仅业务接口）

鉴权声明回答"能不能调这个接口"，审计声明回答"这次操作要不要留痕"。业务接口必须同时给出两者。

| 做法 | 含义 |
|---|---|
| 方法体内调用 `AuditRecorder` | 需要审计 |
| 方法上标注 `@NoAudit("原因")` | 明确声明无需审计，并写明理由 |
| 两者皆无 | 视为未完成，构建失败 |

`@NoAudit` 契约：

| 项 | 约定 |
|---|---|
| 位置 | `rbac-api` 注解包，与 `@RequiresPermission` 同模块 |
| 作用目标 | `@Target(METHOD)`；不支持类级 |
| 属性 | `value()` 必填，不得为空串 |
| 保留策略 | `@Retention(RUNTIME)`，供门禁与测试读取 |
| 门禁 | 业务 Controller 的方法名或路径命中敏感关键词（`export`/`download`/`print`/`delete`/`clear`/`batch`/`import`/`approve`/`grant`/`revoke`），且既未调用 `AuditRecorder` 也未标注 `@NoAudit` → 构建失败 |

门禁局限：基于关键词匹配，只能提醒不能判定。名字不含关键词的敏感操作（如 `POST /orders/{id}/submit` 触发外部转账）查不出来，不替代评审。

### 1.7 幂等性与并发更新

| 操作类型 | 策略 |
|---|---|
| 覆盖式更新 | 集合操作天然幂等，但会丢失更新，必须叠加 `expectedVersion`（见下表） |
| 创建类（POST） | 依赖数据库唯一约束兜底；冲突返回 40900 |
| 删除类 | 天然幂等；重复删除返回成功 |
| 状态切换 | 请求体传目标状态值（如 `{"status": 0}`），禁止 toggle 语义 |

覆盖式更新的版本控制规则：

| 编号 | 规则 |
|---|---|
| V-1 | `PUT /api/users/{id}/roles` 与 `PUT /api/roles/{id}/permissions` 的请求体必须携带 `expectedVersion` |
| V-2 | 对应的 GET 接口必须返回 `version` 字段 |
| V-3 | 服务端条件更新：版本匹配则覆盖写入并将版本号 +1；不匹配返回 40950 |
| V-4 | 版本号取自 `sys_user.role_version` / `sys_role.perm_version` |
| V-5 | 事务内先锁行再校验：`SELECT ... FOR UPDATE` → 约束校验 → 覆盖写入 → 版本号 +1 |
| V-6 | 乐观锁负责发现丢失更新；行锁负责防止约束被并发绕过；两者必须同时存在 |
| V-7 | 前端收到 40950 后必须重新拉取数据，禁止静默重放 |

## 2. 认证接口

### 2.1 POST /api/auth/login — `@PublicApi`

请求：

```json
{ "username": "admin", "password": "<明文密码>" }
```

响应：

```json
{
  "code": 0,
  "data": {
    "accessToken": "<JWT>",
    "expiresIn": 7200,
    "user": { "id": 1, "username": "admin", "nickname": "管理员" },
    "mustChangePassword": false
  }
}
```

错误码：

| code | 场景 | 提示 |
|---|---|---|
| 40110 | 账号或密码错误 | "账号或密码错误"（不区分两者，防账号枚举） |
| 40111 | 账号已停用 | "账号已停用，请联系管理员" |
| 40112 | 账号已锁定 | "账号已锁定，请 X 分钟后重试" |
| 42900 | 触发限流 | "操作过于频繁，请稍后重试" |

限流：同一账号 5 次/分钟；同一 IP 20 次/分钟（滑动窗口）；超限返回 429。

### 2.2 GET /api/auth/me — `@RequiresLogin`

响应：

```json
{
  "code": 0,
  "data": {
    "user": { "id": 1, "username": "admin", "nickname": "管理员", "email": "a@b.com" },
    "permissions": ["*"],
    "roles": [{ "id": 1, "code": "SUPER_ADMIN", "name": "超级管理员" }]
  }
}
```

| 字段 | 用途与约束 |
|---|---|
| `permissions` | 前端权限的唯一数据源：菜单过滤、路由注册、`v-perm` 均依赖它 |
| `roles` | 仅用于个人中心展示；前端不得用角色编码做权限判断 |

### 2.3 POST /api/auth/logout — `@RequiresLogin`

行为：`token_version` 自增 → 广播作废通知 → 各实例拒绝该账号既有令牌。响应 `{"code": 0}`。

### 2.4 POST /api/auth/refresh — `@RequiresLogin`

行为：校验当前令牌有效（未过期或处于宽限期）→ 读取最新 `token_version` 与账号状态 → 签发新令牌。状态已变更则拒绝续期。

### 2.5 PUT /api/auth/password — `@RequiresLogin`

请求：`{ "oldPassword": "...", "newPassword": "..." }`

行为：校验旧密码 → 校验强度策略 → 更新哈希 → `token_version` 自增 → 写安全事件。

## 3. 用户管理接口

| 方法 | 路径 | 权限码 | 说明 | 档 |
|---|---|---|---|---|
| GET | `/api/users` | `sys:user:read` | 分页列表，支持 `keyword`（账号前缀匹配）、`status` | A |
| GET | `/api/users/{id}` | `sys:user:read` | 详情 | A |
| POST | `/api/users` | `sys:user:create` | 新增 | B |
| PUT | `/api/users/{id}` | `sys:user:update` | 编辑（不含角色） | B |
| DELETE | `/api/users/{id}` | `sys:user:delete` | 逻辑删除 | B |
| PUT | `/api/users/{id}/status` | `sys:user:toggle` | 启用/停用，传目标状态 | B |
| PUT | `/api/users/{id}/password:reset` | `sys:user:reset-password` | 重置密码 | B |
| GET | `/api/users/{id}/roles` | `sys:user:read` | 查询已分配角色，响应含 `version` | A |
| PUT | `/api/users/{id}/roles` | `sys:user:assign-role` | 覆盖式设置角色集合，必须带 `expectedVersion` | B |

`POST /api/users` 与 `PUT /api/users/{id}` 请求体：

```json
{
  "username": "zhangsan",
  "nickname": "张三",
  "email": "z@b.com",
  "phone": "13800000000",
  "status": 1,
  "remark": "运维组"
}
```

`PUT /api/users/{id}/roles` 请求体：

```json
{ "roleIds": [2, 5, 7], "expectedVersion": 12 }
```

`GET /api/users/{id}/roles` 响应：

```json
{ "code": 0, "data": { "roleIds": [2, 5], "version": 12 } }
```

校验规则与错误码：

| 规则 | code | 提示 |
|---|---|---|
| 账号重复 | 40900 | "该账号已存在" |
| 删除/停用自己 | 40310 | "不能停用或删除当前登录账号" |
| 移除自己最后一个管理类角色 | 40311 | "不能移除自己的最后一个管理角色" |
| 停用/删除最后一个超级管理员 | 40312 | "系统必须保留至少一个启用的超级管理员" |
| 密码强度不足 | 40010 | "密码需至少 8 位，且包含大小写字母与数字" |
| 角色集合版本不匹配 | 40950 | 见 1.3 |

关键词搜索实现约束：`keyword` 只做账号前缀匹配 `LIKE 'kw%'`；禁止 `LIKE '%kw%'`。昵称模糊搜索如需启用，必须限定结果集上限并单独验证执行计划。

## 4. 角色管理接口

| 方法 | 路径 | 权限码 | 说明 | 档 |
|---|---|---|---|---|
| GET | `/api/roles` | `sys:role:read` | 分页列表，支持 `keyword`、`status` | A |
| GET | `/api/roles/options` | `sys:role:read` | 下拉选项（不分页，仅启用角色） | A |
| GET | `/api/roles/{id}` | `sys:role:read` | 详情（含已绑定权限数、用户数） | A |
| POST | `/api/roles` | `sys:role:create` | 新增 | B |
| PUT | `/api/roles/{id}` | `sys:role:update` | 编辑 | B |
| DELETE | `/api/roles/{id}` | `sys:role:delete` | 逻辑删除，需先校验引用 | B |
| PUT | `/api/roles/{id}/status` | `sys:role:toggle` | 启用/停用，传目标状态 | B |
| GET | `/api/roles/{id}/permissions` | `sys:role:read` | 查询已授权限，响应含 `version` | A |
| PUT | `/api/roles/{id}/permissions` | `sys:role:assign-perm` | 覆盖式设置权限集合，必须带 `expectedVersion` | B |

`PUT /api/roles/{id}/permissions` 请求体：

```json
{
  "permissionCodes": ["sys:user:read", "sys:user:create", "sys:role:read"],
  "expectedVersion": 7
}
```

使用 `permissionCodes` 而非 `permissionIds`：前端权限树节点自带 code，勾选即得；请求体可读，便于排障。服务端 code→id 映射走内存缓存。

校验规则与错误码：

| 规则 | code | 提示 |
|---|---|---|
| 角色码重复 | 40900 | "该角色编码已存在" |
| 删除被用户引用的角色 | 40910 | "该角色仍被 N 个用户绑定，无法删除" |
| 修改/删除内置角色 | 40320 | "内置角色不允许此操作" |
| 修改内置角色的 `*` 权限 | 40321 | "不允许修改内置角色的全部权限" |
| 权限集合版本不匹配 | 40950 | 见 1.3 |

## 5. 权限管理接口

| 方法 | 路径 | 权限码 | 说明 | 档 |
|---|---|---|---|---|
| GET | `/api/permissions/tree` | `sys:perm:read` | 全量权限树（服务端缓存 5 分钟） | A |
| GET | `/api/permissions/{id}` | `sys:perm:read` | 详情 | A |
| POST | `/api/permissions` | `sys:perm:create` | 新增权限点 | B |
| PUT | `/api/permissions/{id}` | `sys:perm:update` | 编辑；`code` 不可修改 | B |
| DELETE | `/api/permissions/{id}` | `sys:perm:delete` | 逻辑删除，需先校验引用 | B |

权限树响应：

```json
{
  "code": 0,
  "data": [
    {
      "id": 10, "code": "sys:user", "name": "用户管理", "resourceType": "MENU",
      "path": "/system/users", "icon": "user", "sort": 10,
      "children": [
        { "id": 11, "code": "sys:user:read", "name": "查询用户", "resourceType": "API", "children": [] },
        { "id": 12, "code": "sys:user:create", "name": "新增用户", "resourceType": "API", "children": [] }
      ]
    }
  ]
}
```

`sys:user` 这类无操作后缀的节点是 `MENU` 类，用于菜单显隐与路由注册，不得作为 `@RequiresPermission` 的取值。这样可保证通配码 `sys:user:*` 只命中 API 权限码。

校验规则与错误码：

| 规则 | code |
|---|---|
| 权限码重复 | 40900 |
| 权限码格式非法（不符合 `<模块>:<资源>:<操作>`） | 40020 |
| 修改 `code` | 40330 |
| 删除被角色引用的权限 | 40920 |
| 删除内置权限 | 40331 |

## 6. 审计日志接口

| 方法 | 路径 | 权限码 | 说明 | 档 |
|---|---|---|---|---|
| GET | `/api/audit-logs` | `sys:audit:read` | 游标分页查询 | B |

查询参数：

| 参数 | 类型 | 约束 |
|---|---|---|
| `startTime` / `endTime` | ISO-8601 | 必填；比较 `event_time`，不是落库时间 |
| `auditCategory` | string | `CHANGE` / `SECURITY`；不传表示全部 |
| `operatorId` | long | 可选 |
| `action` | string | 可选 |
| `targetType` / `targetId` | string / long | 可选 |
| `result` | int | 可选；1 成功，0 失败 |
| `lastId` | long | 游标；首页不传 |
| `size` | int | 默认 20，上限 200 |

`startTime` 必填是硬约束：审计表 180 天约 50~150 万行，无时间范围会退化为全表扫描。本接口的索引方案必须在目标数据量下用 `EXPLAIN ANALYZE` 验证。

## 7. 权限码清单

格式：`<模块>:<资源>:<操作>`，全小写，`-` 连接复合词，`*` 为通配符。

### 7.1 管理端

| 权限码 | 类型 | 对应接口 |
|---|---|---|
| `*` | SYSTEM | 全部权限，仅超级管理员角色持有 |
| `sys:user` | MENU | 用户管理菜单 |
| `sys:user:read` | API | `GET /api/users`、`GET /api/users/{id}`、`GET /api/users/{id}/roles` |
| `sys:user:create` | API | `POST /api/users` |
| `sys:user:update` | API | `PUT /api/users/{id}` |
| `sys:user:delete` | API | `DELETE /api/users/{id}` |
| `sys:user:toggle` | API | `PUT /api/users/{id}/status` |
| `sys:user:reset-password` | API | `PUT /api/users/{id}/password:reset` |
| `sys:user:assign-role` | API | `PUT /api/users/{id}/roles` |
| `sys:role` | MENU | 角色管理菜单 |
| `sys:role:read` | API | `GET /api/roles*`、`GET /api/roles/{id}/permissions` |
| `sys:role:create` | API | `POST /api/roles` |
| `sys:role:update` | API | `PUT /api/roles/{id}` |
| `sys:role:delete` | API | `DELETE /api/roles/{id}` |
| `sys:role:toggle` | API | `PUT /api/roles/{id}/status` |
| `sys:role:assign-perm` | API | `PUT /api/roles/{id}/permissions` |
| `sys:perm` | MENU | 权限管理菜单 |
| `sys:perm:read` | API | `GET /api/permissions/tree`、`GET /api/permissions/{id}` |
| `sys:perm:create` | API | `POST /api/permissions` |
| `sys:perm:update` | API | `PUT /api/permissions/{id}` |
| `sys:perm:delete` | API | `DELETE /api/permissions/{id}` |
| `sys:audit` | MENU | 审计日志菜单 |
| `sys:audit:read` | API | `GET /api/audit-logs` |

### 7.2 内置角色与权限映射

| 角色 | 权限码 |
|---|---|
| `SUPER_ADMIN` | `*` |
| `PERM_ADMIN` | `sys:user:*`、`sys:role:*`、`sys:perm:*`、`sys:audit:read` + 对应 MENU 权限 |
| `AUDITOR` | `sys:audit:read`、`sys:audit` |

通配码判定：`*` 命中一切；`sys:user:*` 命中所有以 `sys:user:` 开头的权限码（字符串前缀匹配）。前缀匹配只在用户权限集合含通配项时触发；普通用户只走一次 `HashSet.contains` 精确匹配。算法见 [05](./05-RBAC0到RBAC3演进设计.md)。

### 7.3 业务权限码（示例）

| 权限码 | 说明 |
|---|---|
| `biz:order` | 订单管理菜单 |
| `biz:order:read` / `biz:order:create` / `biz:order:export` | 订单相关操作 |
| `biz:report:view` | 报表查看 |

业务模块新增权限码步骤：

1. 在本业务模块自己的常量类中定义常量（如 `biz-order` 模块的 `OrderPermissions.EXPORT`）
2. 接口方法标注 `@RequiresPermission(OrderPermissions.EXPORT)`
3. 通过 Flyway 新增权限点数据（MENU / BUTTON / API 按需）
4. 更新本文档 7.3

步骤 2 与步骤 3 的一致性由构建门禁校验：代码引用的权限码若在初始化数据中无定义，构建失败。

## 8. 性能档位

| 档位 | 指标 | 判定依据 | 实现手段 |
|---|---|---|---|
| A | P99 ≤ 30ms | 主键或唯一索引等值查询，返回 ≤ 20 条；或纯内存计算无 DB 访问 | 本地缓存零 DB 查询；分页走主键；权限树服务端缓存 5 分钟 |
| B | P99 ≤ 200ms | 含写操作 + CHANGE 审计；多条件筛选；全量权限树 | 单事务提交；审计表仅时间索引；游标分页 |
| 例外 | 无硬指标 | BCrypt 登录；导出与批量导入；白名单内的导出操作 | 独立线程池隔离，不占用通用线程池 |

档位归属规则：

- 导出类接口一律归例外档，不得归 A 档。
- 新接口必须在本文档对应接口表填写档位。
- 压测按档位分别统计 P99，A 档不达标即阻断发布。

## 9. 接口变更规则

| 项 | 规则 |
|---|---|
| 破坏性变更 | 禁止（删除字段、改字段类型、改路径）。需要时新增接口或字段，旧接口标记废弃并保留一个版本周期 |
| 权限码变更 | 禁止修改已发布权限码。需要调整语义时新增权限码并迁移授权关系 |
| 同步更新 | 接口变更必须同步更新本文档、01 文档的功能追踪表、前端 API 封装 |
| 契约校验 | 构建门禁：每个 `@RequestMapping` 方法必须有 `@PublicApi` / `@RequiresLogin` / `@RequiresPermission` 之一 |
| 审计声明 | 每个业务接口必须显式声明审计意图（`AuditRecorder` 或 `@NoAudit`） |
| 新增接口自查 | 逐项确认：权限码已定义且有初始化数据 / 性能档位已归类 / 归属校验是否需要 / 审计意图已声明 |
# 05 · RBAC0 → RBAC3 演进设计

相关文档：[00 基线](./00-编码代理工作基线.md) · [01 需求](./01-需求规格说明书.md) · [02 总体设计](./02-总体设计说明书.md) · [03 数据模型](./03-数据模型设计.md) · [04 接口](./04-接口设计.md)

## 1. 四个层次的定义

```text
RBAC0  用户 → 角色 → 权限
  ├─ RBAC1  + 角色继承
  ├─ RBAC2  + 约束规则
  └─ RBAC3  = RBAC1 + RBAC2
```

| 层次 | 新增机制 | 影响位置 |
|---|---|---|
| RBAC0 | 用户-角色、角色-权限两层关系与权限判定 | 全部 |
| RBAC1 | 角色之间多一条继承关系 | 只影响"角色集合 → 权限集合"的计算 |
| RBAC2 | 授权动作上增加校验规则 | 只影响"写入授权关系"时的校验 |

RBAC1 改变读路径（怎么算出权限），RBAC2 改变写路径（允不允许建立这条授权关系）。两者作用位置不同，互不干扰，因此 RBAC3 不需要额外设计。

## 2. 演进总览

口径限定：下表的"业务接口权限声明"与"鉴权入口契约"两列，含义仅为——`@RequiresPermission` 的取值不变、过滤器与拦截器契约不变。这不意味着升级无工作量，见 §8。

| 阶段 | 目标 | 数据变化 | 代码变化 | 权限声明 | 鉴权入口 | 前端变化 |
|---|---|---|---|---|---|---|
| 0 | RBAC0 上线 | 6 张表（继承字段已预留） | 全新实现 | 新增 | 全新实现 | 全新实现 |
| 1 | RBAC1 继承 | 填继承关系值 | 权限计算实现 + 缓存加载 SQL | 不变 | 不变 | 角色列表改树形；新增继承来源选择 |
| 2 | RBAC2 约束 | 新增 `sys_role_constraint` + 规则数据 | 新增校验器实现类 | 不变 | 不变 | 新增约束管理页；授权失败提示 |
| 3 | RBAC3 | 无 | 无 | 不变 | 不变 | 无 |

各阶段代价按六个维度估算：

| 维度 | 阶段 1 | 阶段 2 |
|---|---|---|
| 代码变更 | 继承链展开 + 环检测、缓存加载 SQL | 2 个校验器实现类 |
| 数据迁移 | 填继承关系（可按角色灰度） | 新增约束规则 |
| 接口新增 | `GET /api/roles/tree`；角色接口新增可选字段 | 约束规则 CRUD |
| 前端变更 | 角色列表改树形、表单单选 | 约束管理页、失败提示文案 |
| 测试回归 | 单层/多层/菱形/成环/停用 + 权限快照零差异比对 | 互斥/基数 + 并发授权 + RBAC0 校验器回归 |
| 灰度与回滚 | 回滚方式：清空继承关系（改数据，不发版本） | 回滚方式：停用规则 |

## 3. 阶段 0：RBAC0

### 3.1 数据模型与预留

表结构见 [03 §4](./03-数据模型设计.md)。两处预留：

| 项 | 要求 |
|---|---|
| `sys_role.inherit_role_id` | 字段存在，RBAC0 阶段恒为 0 |
| `ConstraintValidator` 校验链 | 链已存在，挂 4 个实现（见 3.4） |

命名使用 `ConstraintValidator` 而非 `AssignRoleValidator`：RBAC2 的领域术语是"约束"，对齐术语可避免将来改名。

### 3.2 权限计算算法（RBAC0）

```text
输入：userId
输出：Set<String> 权限码集合

1. roleIds ← userRoleMap[userId]
2. roleIds ← { r | roleStatus[r] = 启用 }
3. codes   ← ∪ { rolePermMap[r] | r ∈ roleIds }
4. codes   ← { c | permEnabled[c] = true }
5. return codes
```

必须保持的性质：

| 性质 | 约束 |
|---|---|
| 纯函数 | 相同输入必得相同输出；不写库、不发消息 |
| 只读缓存 | 不查数据库 |
| 复杂度 | O(角色数 × 每角色权限数)，微秒级 |
| 无拒绝语义 | 只有正向授权；不引入"拒绝优先"（会与 RBAC2 约束语义纠缠） |

### 3.3 鉴权判定

```text
hasPermission(userId, requiredCode):
    codes ← resolve(userId)
    return codes.contains(requiredCode)
        || codes.contains("*")
        || codes.contains(prefixWildcard(requiredCode))   // sys:user:* 命中 sys:user:delete
```

前缀通配匹配只在用户权限集合含通配项时触发；普通用户只走一次 `HashSet.contains`。

### 3.4 写入校验链

所有写授权关系的操作（分配角色、分配权限、启停用户或角色）必须经过同一条链：

```text
AuthorizationCommand
  → 校验链：for each ConstraintValidator v: v.validate(command)，不通过则抛业务异常
  → 事务内写入关系表 + 写 CHANGE 审计 → 提交
  → 提交后：版本号自增 + 发布失效通知
```

RBAC0 链上的校验器：

| 校验器 | 规则 |
|---|---|
| `LastSuperAdminValidator` | 系统必须保留 ≥ 1 个启用的超级管理员 |
| `SelfLockoutValidator` | 不能删除或停用自己；不能移除自己最后一个管理类角色 |
| `BuiltinRoleProtectionValidator` | 内置角色不可删除或停用；其 `*` 权限不可移除 |
| `RoleReferenceValidator` | 角色被用户引用时不可删除 |

这 4 个校验器在 RBAC2 阶段继续留在链上，只追加互斥与基数校验器。

## 4. 阶段 1：升级到 RBAC1

### 4.1 模型变化与语义

在 `sys_role.inherit_role_id` 上填入值，形成继承链：

```text
运营专员 (inherit=0)  ←── 运营主管 (inherit=专员.id)  ←── 运营总监 (inherit=主管.id)
   权限最小                 权限 ⊇ 自身 + 专员              权限 ⊇ 全部三级

"←──" 读作"从…继承权限"。有效权限 = 自身权限 ∪ 继承链上全部角色的权限。
```

语义约定（唯一解释）：

| 约定 | 内容 |
|---|---|
| 字段含义 | `inherit_role_id` 表示"我从哪个角色继承权限"，不是组织上级 |
| 继承方向 | 沿 `inherit_role_id` 向链尾收集，取并集 |
| 并集语义 | 当前角色权限 = 自身 ∪ 链上全部角色的权限 |
| 不支持减去 | 不存在"链上有 A 但本角色不要 A"的表达；否则结果依赖遍历顺序 |
| 无继承行为不变 | `inherit_role_id = 0` 时与 RBAC0 行为完全一致 |
| 链深上限 | 5 层 |
| 界面展示方向 | 渲染方向自由（可把权限最大的角色画在顶部），不影响数据方向 |

数据层只能有一个明确方向；展示方向是渲染问题，不得转嫁到数据模型。

### 4.2 数据变化

| 项 | 结论 |
|---|---|
| 加列 | 不需要（字段已存在） |
| 加表 | 不需要 |
| 加索引 | 不需要（`idx_inherit_role_id` 已存在） |
| 实际操作 | `UPDATE sys_role SET inherit_role_id = ? WHERE id = ?`；存量角色保持 0 |

灰度：先给 1~2 个角色配置，观察后再放开。未配置继承的角色行为不变，风险被限制在已配置的角色上。

### 4.3 实现时机决策（D-2，待定）

| 项 | 方案甲：阶段 0 就实现展开 | 方案乙：升级时再实现 |
|---|---|---|
| 代码量 | 约 40 行 + 单元测试 | 现在 0 行，升级时约 40 行 |
| 升级时动作 | 仅填数据 + 前端放开选择 | 填数据 + 改实现 + 重新测试 + 重新部署 |
| 升级回滚 | 把 `inherit_role_id` 置 0，不部署不停机 | 需回滚部署旧版本 |
| 风险 | 有一段当前不生效的逻辑 | 算法与数据同时变更，出问题难区分来源 |

方案甲在 RBAC0 数据下是恒等变换（一层都不加），行为与 RBAC0 一致。

若选方案甲，必须配套：

| 风险 | 对策 |
|---|---|
| 逻辑在生产从未生效 | 单元测试覆盖多层、菱形汇聚、成环；阶段 0 末期做一次升级预演 |
| 环检测本身有缺陷 | 访问集合 + 深度上限双重保护，深度上限保证不死循环 |
| 深链拖慢计算 | 深度上限 5；按角色 ID 去重 |

### 4.4 权限计算算法（RBAC1）

```text
1. directRoles ← userRoleMap[userId]
2. directRoles ← { r | roleStatus[r] = 启用 }
3. effectiveRoles ← 展开继承链(directRoles)        ★ 唯一新增步骤
4. codes ← ∪ { rolePermMap[r] | r ∈ effectiveRoles }
5. codes ← { c | permEnabled[c] = true }

展开继承链(起步集合):
    result ← {}; queue ← 起步集合
    while queue 非空:
        r ← queue.poll()
        if r ∈ result: continue              // 菱形汇聚去重
        if result.size() > 5: 抛异常          // 环与超深保护
        result.add(r)
        src ← inheritRoleMap[r]
        if src ≠ 0: queue.add(src)
```

实现约束：

| 项 | 要求 |
|---|---|
| 数据来源 | 内存缓存（`inheritRoleMap`、`roleStatus`），不查库 |
| 是否缓存最终权限集合 | 不缓存；只缓存事实。否则"给被继承角色加权限"会使所有下游角色用户的缓存失效 |
| 环的处理 | 告警 + 按"不加继承"处理（降级为 RBAC0 行为），不拒绝请求 |
| 停用角色 | 停用后仍保留在链中，但不进入有效集合 |

### 4.5 缓存变化

| 缓存 | 变化 |
|---|---|
| A：roleId → 权限码集合 | 不变 |
| B：userId → roleId 集合 | 不变 |
| C：roleId → inheritRoleId | 新增（约 500 条） |
| roleId → status | 不变 |
| permissionCode → enabled | 不变 |

缓存 C 可并入缓存 A 的重载查询：`SELECT id, inherit_role_id, status FROM sys_role`。升级时必须同步修改缓存加载 SQL。

### 4.6 接口变化

| 接口 | 变化 | 破坏性 |
|---|---|---|
| `GET /api/roles` | 响应新增 `inheritRoleId`、`inheritRoleName` | 否 |
| `GET /api/roles/tree` | 新增，返回按继承关系组织的角色视图 | 否 |
| `POST /api/roles`、`PUT /api/roles/{id}` | 请求体新增可选 `inheritRoleId` | 否 |
| 其他接口 | 不变 | — |

新增错误码：

| 错误码 | 场景 |
|---|---|
| 40930 | 设置继承来源形成环 |
| 40931 | 超过最大继承链深度 |
| 40932 | 选择的继承来源角色已停用 |

### 4.7 前端变化

| 项 | 变化 |
|---|---|
| 角色列表 | 改为树形表格（Element Plus `el-table` 的 `tree-props`）；渲染方向由前端决定 |
| 角色表单 | 新增"继承来源角色"下拉，需排除自身与其继承链上的角色 |
| 权限判断 | 不变（只用 `permissions` 权限码） |
| 授权页面 | 不变（继承关系由后端计算） |

### 4.8 不需要改的部分

| 类别 | 项 |
|---|---|
| 业务代码 | `@RequiresPermission` 注解决策与权限判断逻辑 |
| 鉴权链路 | `JwtAuthFilter`、`PermissionInterceptor`、`PermissionResolver` 接口契约 |
| 数据表 | 已有字段与索引 |
| 前端 | `v-perm` 指令、路由守卫、菜单过滤、用户授权页面 |
| 认证模块 | 全部 |

### 4.9 回归测试点

| # | 测试点 | 预期 |
|---|---|---|
| 1 | 无继承的既有角色 | 权限与升级前逐条一致 |
| 2 | 单层继承 | 继承方获得被继承角色的权限 |
| 3 | 多层链式（3 层） | 链尾角色获得链上全部角色的权限 |
| 4 | 菱形汇聚 | 共同角色权限只计一次 |
| 5 | 被继承角色停用 | 该角色权限不生效，继承方自身权限仍生效 |
| 6 | 方向断言（必测） | `主管.inherit=专员` 时主管拥有专员权限；反向配置时结果相反。方向不得反转 |
| 7 | 配置成环 | 接口拒绝（40930） |
| 8 | 已存在的环（脏数据） | 降级为 RBAC0 行为 + 告警，不返回 500 |
| 9 | 权限变更广播 | 修改被继承角色权限后，链尾角色用户 1 秒内生效 |
| 10 | 缓存重建 | 重建后包含 `inheritRoleId` |
| 11 | 全量权限快照对比 | 未配置继承的用户升级前后零差异 |

第 6 项覆盖"不会报错、只会静默越权"的缺陷类型。

第 11 项做法：升级前导出全部用户的权限码集合快照，升级后（未配置任何继承时）再导出一次逐条比对。

## 5. 阶段 2：升级到 RBAC2

### 5.1 约束类型

约束是对"授权动作"的限制，不是权限本身。

| 类型 | 含义 | 例子 | 术语 |
|---|---|---|---|
| 互斥（静态） | 两个角色不能同时授予同一人 | "付款申请"与"付款审批" | SSD |
| 基数（静态） | 角色人数上限 | "部门经理"最多 1 人 | Cardinality |
| 互斥（动态） | 可同时拥有，但不能同时激活 | 需"会话激活角色"概念 | DSD |

本期只实现静态互斥与基数。DSD 需要改动登录流程与前端交互，成本明显更高；将来实现也只是"新增表 + 新增校验器 + 新增会话概念"，不推翻已有结构。

### 5.2 数据变化

新增 `sys_role_constraint`（见 [03 §4.6](./03-数据模型设计.md)）。纯新增，现有表与 SQL 不受影响。

### 5.3 代码变化

在既有校验链上追加 2 个实现类（互斥、基数）。修改已有类：0。修改接口：0。修改表：0。业务代码：0。

### 5.4 校验器契约

```java
interface ConstraintValidator {
    void validate(AuthorizationCommand cmd);   // 不通过则抛 ConstraintViolatedException(错误码, 提示)
}
```

| 性质 | 要求 |
|---|---|
| 输入 | 一次授权变更的意图，不是数据库状态；校验器自行读取所需数据 |
| 互不感知 | 新增校验器不改动已有代码 |
| 失败即整体拒绝 | 不允许部分成功 |
| 只读 | 不写库，保证链可重复执行 |

命令对象需提供操作完成后的**最终集合**，而非增量。理由：约束判定针对"结果是否合法"，提供最终集合可避免每个校验器各自推演"当前集合 + 增量"。

### 5.5 并发下的约束校验

问题场景：两个管理员同时给同一用户授予互斥的两个角色，若两者都读到"当前无冲突"的状态，则约束被绕过。

对策：

| 方案 | 做法 | 结论 |
|---|---|---|
| 行级锁串行化 | 事务内先 `SELECT ... FROM sys_user WHERE id = ? FOR UPDATE` 锁目标用户；角色容量约束锁目标角色行 | 采用 |
| 唯一约束表达 | 互斥关系需要两行对称插入，无法用唯一索引表达 | 不采用 |
| Redis 分布式锁 | 引入锁超时、锁失效、Redis 故障等新问题 | 不采用 |

授权操作每天几十次，行锁等待可忽略。

行锁与乐观锁分工：行锁保证"校验与写入之间不被并发穿透"，`expectedVersion` 保证"发现编辑期间数据已被改动"。两者不可互相替代（见 [03 §6.1](./03-数据模型设计.md)）。

### 5.6 约束语义硬规则

| 编号 | 规则 | 依据 |
|---|---|---|
| C-1 | 约束只检查直接授予的角色，不检查继承来的角色 | 约束管理的是"身上挂了哪些角色"，不是"因此获得了哪些能力"。若按展开后的集合判定，改继承关系会使历史授权突然非法 |
| C-2 | 新增约束规则时允许存在历史冲突数据，但必须同时输出冲突用户清单 | 若要求清理干净才能保存，上线后就再也加不了新规则。规则保存成功后，新增授权受约束，既有授权不强制收回 |
| C-3 | 基数下限只告警，不拦截写入；只有上限才拦截 | 下限做成硬拒绝会导致死锁：当前只有 1 个审批人时，连修改该用户其他信息都会被拒 |

### 5.7 接口与前端变化

| 项 | 变化 | 破坏性 |
|---|---|---|
| `GET/POST/PUT/DELETE /api/role-constraints` | 新增，权限码 `sys:constraint:read/create/update/delete` | 否 |
| `PUT /api/users/{id}/roles` | 接口不变，新增业务错误码 40940（违反互斥）/ 40941（违反基数） | 否 |
| 前端 | 新增角色约束管理页 | 否 |

授权失败的提示必须说清违反了哪条规则，而不是笼统的"操作失败"。

错误码区分：

| 类别 | 含义 | 前端动作 |
|---|---|---|
| 403xx | 没有操作权限 | 找管理员要权限 |
| 4094x | 有权限但违反业务规则 | 修改授权方案 |
| 40950 | 数据版本过期 | 刷新后重试 |

### 5.8 回归测试点

| # | 测试点 | 预期 |
|---|---|---|
| 1 | 无约束规则 | 行为与 RBAC1 一致 |
| 2 | 互斥：先授 R1 再授 R2 | 第二次被拒 40940 |
| 3 | 新增互斥规则与已有授权冲突 | 规则可保存，并返回冲突用户清单 |
| 4 | 批量授权中出现冲突 | 整体回滚，指出冲突项 |
| 5 | 基数超过上限 | 被拒 40941 |
| 6 | 基数低于下限 | 仅告警，不拒绝 |
| 7 | 并发授予互斥角色 | 最终结果不违反约束 |
| 8 | RBAC0 的 4 个校验器 | 仍生效 |

## 6. 阶段 3：RBAC3

不需要任何动作。RBAC1 已在阶段 1 生效，RBAC2 已在阶段 2 生效，两者叠加即为 RBAC3。

唯一需要确认的交互点：继承得到的角色是否参与互斥判定。

| 方案 | 结论 |
|---|---|
| 按直接授予的角色判定 | 采用。语义可解释，且改继承关系不会使历史授权变非法 |
| 按展开后的有效角色集合判定 | 不采用。会出现"加一个角色却因链上远处角色被拒"的费解情况 |

此规则已写入 §5.6 的 C-1。

## 7. 三个扩展点

这三个抽象是升级路径的承重结构，接口一旦定稿不得随意修改。

### 7.1 PermissionResolver

```java
Set<String> resolve(long userId);
```

| 要求 | 说明 |
|---|---|
| 返回只读集合 | 调用方不得修改 |
| 无副作用 | 重复调用结果相同 |
| 自行处理异常情况 | 用户不存在或已停用返回空集合，不抛异常、不返回 null |
| 不抛出与权限无关的异常 | 重载失败时返回旧值或空集合并告警 |

实现方在 `rbac-cache`（缓存装饰 + 惰性重建 + 单飞），计算逻辑在 `rbac-core`。

### 7.2 ConstraintValidator

```java
interface ConstraintValidator {
    void validate(AuthorizationCommand cmd);
}

interface AuthorizationCommand {
    long operatorId();
    long targetUserId();
    long targetRoleId();
    Set<Long> finalRoleIds();     // 本次操作完成后的最终角色集合
}
```

实现散落在 `rbac-core` 内，通过 `rbac-api` 的接口被调用。

### 7.3 失效通知

```java
record CacheInvalidateEvent(
    ChangeType type,     // PERM_CHANGED / TOKEN_REVOKED / TOKEN_REVOKED_GLOBAL
    long version,
    Long targetUserId)
{}
```

| 要求 | 依据 |
|---|---|
| 必须在事务提交后发布 | 顺序错误会把旧数据写回缓存 |
| 发布失败不影响业务成功 | TTL 兜底 |
| 消息体保持极小，不含数据 | 只通知丢弃缓存，内容由各实例自行重载 |
| 采用失效而非更新语义 | 无论事件到达顺序如何，重载都取数据库当前状态，不存在旧事件覆盖新状态 |
| 新增缓存对象时必须同步更新失效逻辑 | 升级时最易漏的一项 |

## 8. 升级代价

| 动作 | 无预留所需改动 | 本设计所需改动 |
|---|---|---|
| RBAC1 加继承 | 加列与索引、改实体、改映射、改接口响应、改前端列表与表单、改权限计算、改缓存 SQL、全量回归 | 填数据、改缓存 SQL 多取一列、前端列表改树形、表单加下拉 |
| RBAC2 加约束 | 建表、设计校验插入位置、改所有授权接口、改前端提示 | 建表、新增 2 个校验器类、新增页面 |
| RBAC3 | 可能需重新设计继承与约束的交互 | 无动作 |

预留的代价：

| 项 | 量级 |
|---|---|
| `inherit_role_id` 字段与索引 | 4 KB + 1 个索引 |
| 继承链展开算法（方案甲） | 约 40 行 + 测试，当前不生效 |
| 校验链抽象 | 约 20 行接口；4 个校验器本就必须实现 |

